<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COUNTLESS - Grandad's Countdown</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>

    <!-- STAGE CONTAINER (CENTERED ON SCREEN) -->
    <div class="stage-container">
        <!-- VIRTUAL FIXED RESOLUTION VIEWPORT (840x540) -->
        <div id="gameViewport" class="game-viewport">
            <!-- GLOBAL NAVIGATION TABS -->
            <nav class="nav-bar">
                <button class="nav-tab active" data-screen="splash">🏠 HOME</button>
                <button class="nav-tab" data-screen="letters">🔤 LETTERS ROUND</button>
                <button class="nav-tab" data-screen="numbers">🔢 NUMBERS ROUND</button>
                <button class="nav-tab" data-screen="conundrum">🧩 CONUNDRUM ROUND</button>
                <button class="nav-tab" data-screen="lobby">🎮 ROOM LOBBY</button>
            </nav>

            <!-- DYNAMIC SCREEN MOUNT CONTAINER -->
            <div id="appMount"></div>
        </div>
    </div>

    <!-- Modular Entry Point -->
    <script type="module" src="js/main.js?v=10"></script>
</body>
</html>
