<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COUNTLESS - Grandad's Countdown</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=19">
</head>
<body>
    <!-- PORTRAIT ROTATION WARNING OVERLAY -->
    <div id="portraitWarning" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#0f172a; z-index:10000; flex-direction:column; justify-content:center; align-items:center; color:white; text-align:center; padding:20px;">
        <span style="font-size:4rem; margin-bottom:20px;">🔄</span>
        <h2 style="font-family:'Outfit', sans-serif; font-weight:900; margin-bottom:15px; font-size: 2rem;">PLEASE ROTATE DEVICE</h2>
        <p style="font-family:'Outfit', sans-serif; font-size:1.1rem; color:#fbbf24; font-weight:600;">Countless requires a landscape orientation to fit the game board.</p>
    </div>

    <!-- MOBILE FULLSCREEN OVERLAY -->
    <div id="mobileFullscreenOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100dvh; background:#0f172a; z-index:9999; flex-direction:column; justify-content:center; align-items:center; color:white; text-align:center; padding:10px;">
        <button id="btnEnterFullscreen" style="padding:20px 40px; font-size:1.5rem; font-family:'Outfit', sans-serif; font-weight:900; cursor:pointer; background:#fbbf24; color:#0f172a; border:none; border-radius:12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5);">📱 TAP FOR FULL SCREEN</button>
        <p style="font-family:'Outfit', sans-serif; font-size:0.9rem; color:#94a3b8; margin-top:15px; font-weight:600;">Required for the best layout experience</p>
    </div>

    <!-- STAGE CONTAINER (CENTERED ON SCREEN) -->
    <div class="stage-container">
        <!-- VIRTUAL FIXED RESOLUTION VIEWPORT (840x540) -->
        <div id="gameViewport" class="game-viewport">
            <!-- DYNAMIC SCREEN MOUNT CONTAINER -->
            <div id="appMount"></div>
        </div>
    </div>

    <!-- Modular Entry Point -->
    <script type="module" src="js/main.js?v=19"></script>
</body>
</html>
